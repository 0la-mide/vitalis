[project]
name = "vitalis-backend"
version = "0.1.0"
description = "VITALIS backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.5",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "pywebpush>=2.5.0",
    "qrcode[pil]>=8.2",
    "scikit-learn==1.8.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
extend-ignore = ["B008", "UP046", "RUF012", "SIM103", "C408"]
