# VITALIS on one VPS behind the host's existing Traefik reverse proxy.
# Usage (from repo root): docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: vitalis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitalis
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  model:
    build: { context: ../model }
    restart: unless-stopped
    expose: ["8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [internal]

  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://vitalis:${POSTGRES_PASSWORD}@postgres:5432/vitalis
      MODEL_URL: http://model:8100
      COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
      model: { condition: service_healthy }
    expose: ["8000"]
    volumes:
      - backend-var:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks: [internal]

  frontend:
    build: { context: ../frontend, dockerfile: ../deploy/frontend.Dockerfile }
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8000
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    expose: ["8080"]
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      # Traefik routes only to a healthy container: a short interval keeps the post-deploy 404 window to seconds.
      interval: 5s
      timeout: 5s
      retries: 3
    networks: [internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.vitalis.rule: "Host(`${DOMAIN:?set DOMAIN in .env}`)"
      traefik.http.routers.vitalis.entrypoints: websecure
      traefik.http.routers.vitalis.tls: "true"
      traefik.http.routers.vitalis.tls.certresolver: letsencrypt
      traefik.http.services.vitalis.loadbalancer.server.port: "8080"

volumes:
  pgdata:
  backend-var:

networks:
  internal:
