# VITALIS on one VPS. Only nginx is published; postgres and the model are internal.
# Usage (from repo root): docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: vitalis

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitalis
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  model:
    build: { context: ../model }
    restart: unless-stopped
    expose: ["8100"]
    networks: [internal]

  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://vitalis:${POSTGRES_PASSWORD}@postgres:5432/vitalis
      MODEL_URL: http://model:8100
      COOKIE_SECURE: "true"
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
    expose: ["8000"]
    volumes:
      - uploads:/app/var/uploads
    networks: [internal]

  frontend:
    build: { context: ../frontend, dockerfile: ../deploy/frontend.Dockerfile }
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8000
    expose: ["3000"]
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    networks: [internal]

volumes:
  pgdata:
  uploads:
  certbot-www:

networks:
  internal:
